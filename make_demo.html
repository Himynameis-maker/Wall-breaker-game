      border-radius: 8px;
      padding: 9px 14px;
      font-size: 0.86rem;
      font-weight: bold;
      cursor: pointer;
      display: inline-block;

    button.green { background: #1e8848; border-color: #46cf7c; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    input[type="file"] { display: none; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 5px;
      font-size: 0.78rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .item {
      background: #111622;
      border: 1px solid #28334a;
      border-radius: 6px;
      padding: 5px 8px;
      color: #8fa0be;
    }
    .item.ok {
      border-color: #2f9658;
      color: #8cf2b0;
    }
    textarea {
      width: 100%;
      min-height: 84px;
      background: #0b0f18;

    <p>

      変数名（マリオ・スパイク・スパナゴン等）をすべてオリジナル名に変えた1ファイル完結の <b>robot_breaker.html</b> がダウンロードされます。
    </p>

    <div class="btn-row">
      <button id="autoFetchBtn" type="button">① 自動読込 (Webサーバー時)</button>
      <label class="file-btn">
        ① フォルダごと選ぶ (PCおすすめ)
        <input id="dirInput" type="file" webkitdirectory directory multiple>
      </label>
      <label class="file-btn">
        ① src内14ファイルをまとめて選ぶ (スマホ等)
        <input id="filesInput" type="file" multiple accept=".js,.txt">
      </label>
    </div>

    <div id="statusEl" class="status">まずは①からファイルを読み込んでください</div>
    <div id="fileGrid" class="grid"></div>
  </div>

13,9],[3,14,9],[3,15,9],[4,2,9],[4,3,9],[4,4,9],[4,5,209],[4,6,209],[4,7,9],[4,8,1],[4,9,177],[4,10,241],[4,11,241],[4,12,241],[4,13,8],[4,14,193],[4,15,9],[5,4,225],[5,5,209],[5,6,209],[5,8,1],[5,10,1],[6,2,9],[6,3,2],[6,4,9],[6,5,9],[6,6,9],[6,7,9],[6,8,9],[6,9,2],[6,10,9],[6,11,9],[6,12,9],[6,13,9],[6,14,2],[6,15,9],[7,3,2],[7,9,2],[7,14,2]],"mario":{"x":96,"y":64,"dir":1},"spike":{"x":128,"y":256,"dir":2},"enemies":[{"enemyType":"eggplant","x":64,"y":256,"dir":1},{"enemyType":"eggplant","x":176,"y":256,"dir":1},{"enemyType":"eggplant","x":240,"y":256,"dir":1},{"enemyType":"eggplant","x":32,"y":256,"dir":1},{"enemyType":"spanagon","x":192,"y":64,"dir":2},{"enemyType":"spanagon","x":32,"y":192,"dir":1}]}}</textarea>

  <script>
    (function () {
      const REQUIRED_FILES = [
        "constants.js",
        "actor_stepper.js",
        "spike_ai.js",
        "enemy_ai.js",
        "game_world.js",
        "renderer.js",
        "render_tiles.js",
        "render_actors.js",
        "render_enemies.js",
        "char_player.js",
        "char_spike.js",
        "char_spanagon.js",
        "char_eggplant.js",
        "char_fireball.js"
      ];

      const loadedMap = new Map();
      const fileGrid = document.getElementById("fileGrid");
      const statusEl = document.getElementById("statusEl");
      const buildBtn = document.getElementById("buildBtn");
      const autoFetchBtn = document.getElementById("autoFetchBtn");
      const dirInput = document.getElementById("dirInput");
      const filesInput = document.getElementById("filesInput");
      const stagesInput = document.getElementById("stagesInput");

      function updateFileStatus() {
        fileGrid.innerHTML = "";
        let okCount = 0;
        REQUIRED_FILES.forEach(name => {
          const has = loadedMap.has(name);
          if (has) okCount++;
          const div = document.createElement("div");
          div.className = "item" + (has ? " ok" : "");
          div.textContent = (has ? "✅ " : "⬜ ") + name;
          fileGrid.appendChild(div);
        });
        if (okCount === REQUIRED_FILES.length) {
          statusEl.textContent = "準備完了！14個すべて揃いました。下の②ボタンを押してください。";
          buildBtn.disabled = false;
        } else {
          statusEl.textContent = "読込済み: " + okCount + " / " + REQUIRED_FILES.length + " 個";
          buildBtn.disabled = true;
        }
      }

      function sanitizeIdentifiers(code) {
        const pairs = [
          ["marioSprites", "legacyWorkerSprites"],
          ["spikeSprites", "legacyBossSprites"],
          ["endoSpikeSprites", "endoBossSprites"],
          ["spanagonFast", "monitorFast"],
          ["SPANAGON_FAST", "MONITOR_FAST"],
          ["WreckGame", "RobotGame"],
          ["WreckRender", "RobotRender"],
          ["WreckSprites", "RobotSprites"],
          ["WreckStages", "RobotStages"],
          ["Mario", "Player"],
          ["mario", "player"],
          ["SpikeAI", "BossAI"],
          ["spikeAI", "bossAI"],
          ["Spike", "Boss"],
          ["SPIKE", "BOSS"],
          ["spike", "boss"],
          ["Spanagon", "MonitorBot"],
          ["SPANAGON", "MONITOR"],
          ["spanagon", "monitorBot"],
          ["Eggplant", "Crawler"],
          ["EGGPLANT", "CRAWLER"],
          ["eggplant", "crawler"],
          ["マリオ", "主人公"],
          ["スパイク", "ライバルロボ"],
          ["スパナゴン", "モニターロボ"],
          ["スパナ", "モニター"],
          ["ナスビ仮面", "四つ足ロボ"],
          ["ナスビ", "四つ足"],
          ["ナス型", "マイコン型"],
          ["レッキングクルー", "ROBOT BREAKER"],
          ["レッキング", "ROBOT BREAKER"]
        ];
        let out = String(code || "");
        for (let i = 0; i < pairs.length; i++) {
          out = out.split(pairs[i][0]).join(pairs[i][1]);
        }
        return out.replace(/<\/script>/gi, "<\\/script>");
      }

      async function tryAutoFetch() {
        statusEl.textContent = "読み込み中...";
        let fail = 0;
        for (const name of REQUIRED_FILES) {
          try {
            const res = await fetch("./src/" + name, { cache: "no-store" });
            if (!res.ok) throw new Error("HTTP " + res.status);
            loadedMap.set(name, await res.text());
          } catch (_) {
            fail++;
          }
        }
        updateFileStatus();
        if (fail > 0) {
          statusEl.textContent = "自動読込できませんでした（ローカル直開き時は「フォルダごと選ぶ」または「src内14ファイルを選ぶ」をお使いください）";
        }
      }

      function handleFileList(fileList) {
        const files = Array.from(fileList || []);
        const tasks = [];
        for (const f of files) {
          const base = f.name.replace(/\.txt$/i, ".js");
          if (REQUIRED_FILES.includes(base)) {
            tasks.push(f.text().then(txt => loadedMap.set(base, txt)));
          }
        }
        Promise.all(tasks).then(updateFileStatus);
      }

      autoFetchBtn.addEventListener("click", tryAutoFetch);
      dirInput.addEventListener("change", e => handleFileList(e.target.files));
      filesInput.addEventListener("change", e => handleFileList(e.target.files));

        let parsedStages;

          parsedStages = JSON.parse(stagesInput.value.trim());

          return;

          .map(k => parsedStages[k])

          return;

          "          else if (d > 17.5) g.fillStyle = (y < c ? '#5c72a4' : '#26324d');",
          "          else if (d > 16.2) g.fillStyle = '#121826';",
          "          else g.fillStyle = '#1b2336';",
          "          g.fillRect(x, y, 1, 1);",
          "        }",
          "      }",
          "      g.fillStyle = '#101522';",
          "      g.fillRect(19, 8, 6, 28);",
          "      g.fillRect(8, 19, 28, 6);",
          "      // 4方向矢印ドット（入力中は光る）",
          "      const upC = (bits & UP) ? '#ffe066' : '#536894';",
          "      const dnC = (bits & DOWN) ? '#ffe066' : '#536894';",
          "      const ltC = (bits & LEFT) ? '#ffe066' : '#536894';",
          "      const rtC = (bits & RIGHT) ? '#ffe066' : '#536894';",
          "      g.fillStyle = upC; g.fillRect(21, 9, 2, 1); g.fillRect(20, 10, 4, 1); g.fillRect(19, 11, 6, 1);",
          "      g.fillStyle = dnC; g.fillRect(19, 32, 6, 1); g.fillRect(20, 33, 4, 1); g.fillRect(21, 34, 2, 1);",
          "      g.fillStyle = ltC; g.fillRect(9, 21, 1, 2); g.fillRect(10, 20, 1, 4); g.fillRect(11, 19, 1, 6);",
          "      g.fillStyle = rtC; g.fillRect(34, 21, 1, 2); g.fillRect(33, 20, 1, 4); g.fillRect(32, 19, 1, 6);",
          "    }",
          "",
          "    function drawStickKnob() {",
          '      const g = stickKnobCanvas.getContext("2d");',
          "      g.clearRect(0, 0, 18, 18);",
          "      for (let y = 0; y < 18; y++) {",
          "        for (let x = 0; x < 18; x++) {",
          "          const d = Math.hypot(x - 8.5, y - 8.5);",
          "          if (d > 8.6) continue;",
          "          if (d > 7.3) g.fillStyle = '#14080c';",
          "          else if (d > 5.8 && x + y > 18) g.fillStyle = '#7e1214';",
          "          else if (d < 4.5 && x < 9 && y < 9) g.fillStyle = '#ff6a58';",
          "          else g.fillStyle = '#d92820';",
          "          g.fillRect(x, y, 1, 1);",
          "        }",
          "      }",
          "      g.fillStyle = '#ffffff';",
          "      g.fillRect(5, 4, 2, 2);",
          "      g.fillRect(7, 4, 1, 1);",
          "    }",
          "",
          "    function drawHammerBtn(pressed) {",
          '      const g = hammerBtnCanvas.getContext("2d");',
          "      g.clearRect(0, 0, 30, 30);",
          "      const oy = pressed ? 1 : 0;",
          "      // 外枠土台",
          "      for (let y = 0; y < 30; y++) {",
          "        for (let x = 0; x < 30; x++) {",
          "          const d = Math.hypot(x - 14.5, y - 14.5);",
          "          if (d > 14.4) continue;",
          "          if (d > 13.0) g.fillStyle = '#080b12';",
          "          else if (d > 11.4) g.fillStyle = '#2d3954';",
          "          else g.fillStyle = '#141926';",
          "          g.fillRect(x, y, 1, 1);",
          "        }",
          "      }",
          "      // 赤いボタン面",
          "      for (let y = 0; y < 30; y++) {",
          "        for (let x = 0; x < 30; x++) {",
          "          const d = Math.hypot(x - 14.5, y - (14 + oy));",
          "          if (d > 10.6) continue;",
          "          if (d > 9.4) g.fillStyle = pressed ? '#821414' : (y < 14 ? '#ff8e7e' : '#7a1212');",
          "          else g.fillStyle = pressed ? '#e03c32' : '#c92a22';",
          "          g.fillRect(x, y, 1, 1);",
          "        }",
          "      }",
          "      // ハンマーのドット絵アイコン",
          "      const hy = 7 + oy;",
          "      g.fillStyle = '#141824';",
          "      g.fillRect(9, hy, 12, 7);",
          "      g.fillRect(13, hy + 6, 4, 9);",
          "      g.fillStyle = '#aebcd0';",
          "      g.fillRect(10, hy + 1, 10, 5);",
          "      g.fillStyle = '#ffffff';",
          "      g.fillRect(10, hy + 1, 10, 2);",
          "      g.fillStyle = '#5c6b82';",
          "      g.fillRect(10, hy + 5, 10, 1);",
          "      g.fillStyle = '#d48e44';",
          "      g.fillRect(14, hy + 6, 2, 8);",
          "      g.fillStyle = '#8c5420';",
          "      g.fillRect(15, hy + 6, 1, 8);",
          "    }",
          "",
          "    drawStickBg(0);",
          "    drawStickKnob();",
          "    drawHammerBtn(false);",
          "",
          "    // === ゲーム進行状態 ===",
          '    let screenMode = "title"; // "title" | "play" | "ending"',
          "    let currentStageIdx = 0;",
          "    let world = null;",
          "    let titleTick = 0;",
          "    let stickBits = 0;",
          "    let keyBits = 0;",
          "    let hammerBtnDown = false;",
          "    const pressedKeys = new Set();",
          "",
          "    // タイトル・エンディングボタン生成",
          "    DEMO_STAGES.forEach((st, idx) => {",
          '      const btn = document.createElement("button");',
          '      btn.type = "button";',
          '      btn.className = "pixel-btn";',
          '      btn.textContent = "STAGE " + (idx + 1);',
          '      btn.addEventListener("click", () => {',
          "        btn.blur();",
          "        startStage(idx);",
          "      });",
          "      opStageBtns.appendChild(btn);",
          "    });",
          "",
          "    function setScreenMode(nextMode) {",
          "      screenMode = nextMode;",
          '      playHeader.classList.toggle("hidden", nextMode !== "play");',
          '      controlsArea.classList.toggle("hidden", nextMode !== "play");',
          '      opPanel.classList.toggle("hidden", nextMode !== "title");',
          '      edPanel.classList.toggle("hidden", nextMode !== "ending");',
          "    }",
          "",
          "    function currentBits() {",
          "      let b = stickBits | keyBits | (hammerBtnDown ? HAMMER : 0);",
          "      if ((b & (LEFT | RIGHT)) === (LEFT | RIGHT)) b &= ~(LEFT | RIGHT);",
          "      if ((b & (UP | DOWN)) === (UP | DOWN)) b &= ~(UP | DOWN);",
          "      return b;",
          "    }",
          "",
          "    function startStage(idx) {",
          "      currentStageIdx = Math.max(0, Math.min(DEMO_STAGES.length - 1, idx));",
          "      const cfg = DEMO_STAGES[currentStageIdx];",
          "      world = new GameWorld(Object.assign({}, cfg, { stageNumber: currentStageIdx + 1 }));",
          "      world.player.prevHammer = (currentBits() & HAMMER) !== 0;",
          '      stageBadge.textContent = "STAGE " + (currentStageIdx + 1) + " / " + DEMO_STAGES.length;',
          "      setScreenMode('play');",
          "      renderer.resetCamera(world);",
          "      renderer.draw(world);",
          "    }",
          "",
          "    function showTitleScreen() {",
          "      world = null;",
          "      pressedKeys.clear();",
          "      keyBits = 0;",
          "      resetStick();",
          "      setHammerPressed(false);",
          "      setScreenMode('title');",
          "    }",
          "",
          "    function showEndingScreen() {",
          "      world = null;",
          "      pressedKeys.clear();",
          "      keyBits = 0;",
          "      resetStick();",
          "      setHammerPressed(false);",
          "      setScreenMode('ending');",
          "    }",
          "",
          "    function drawSceneOverlayScreen(isEnding) {",
          "      const w = 256;",
          "      const h = 240;",
          "      if (canvas.width !== w || canvas.height !== h) {",
          "        canvas.width = w;",
          "        canvas.height = h;",
          "        renderer.ctx.imageSmoothingEnabled = false;",
          "      }",
          '      canvas.style.aspectRatio = w + " / " + h;',
          "      const ctx = renderer.ctx;",
          '      ctx.fillStyle = "#080b14";',
          "      ctx.fillRect(0, 0, w, h);",
          "      const fakeWorld = { introFrame: titleTick, f: 0 };",
          "      ctx.save();",
          "      ctx.translate(0, 126);",
          "      renderer.drawSpaceSky(ctx, w, -126, h, fakeWorld);",
          "      ctx.restore();",
          "",
          "      // 下部に青ブロック地面帯",
          "      if (renderer.floorBlockPattern) {",
          "        ctx.save();",
          "        ctx.translate(0, 214);",
          "        ctx.fillStyle = renderer.floorBlockPattern;",
          "        ctx.fillRect(0, 0, w, 26);",
          "        ctx.restore();",
          "      }",
          "      ctx.fillStyle = '#2858b8'; ctx.fillRect(0, 208, w, 6);",
          "      ctx.fillStyle = '#5890f8'; ctx.fillRect(0, 208, w, 2);",
          "      ctx.fillStyle = '#183070'; ctx.fillRect(16, 210, w - 32, 2);",
          "",
          "      // 装飾キャラを地上へ配置",
          "      if (renderer.playerSprites && renderer.playerSprites.idle_R) {",
          "        ctx.drawImage(renderer.playerSprites.idle_R, isEnding ? 120 : 48, 182);",
          "      }",
          "      if (!isEnding && renderer.monitorBotSprites && renderer.monitorBotSprites.normalFront && renderer.monitorBotSprites.normalFront.idle_L) {",
          "        ctx.drawImage(renderer.monitorBotSprites.normalFront.idle_L, 148, 182);",
          "      }",
          "      if (!isEnding && renderer.crawlerSprites && renderer.crawlerSprites.front && renderer.crawlerSprites.front.idle_L) {",
          "        ctx.drawImage(renderer.crawlerSprites.front.idle_L, 188, 182);",
          "      }",
          "",
          "      if (isEnding) {",
          '        renderer.drawBannerText(ctx, w, "THANK YOU", 78);',
          '        renderer.drawBannerText(ctx, w, "FOR PLAYING!", 106);',
          "      } else {",
          '        renderer.drawBannerText(ctx, w, "ROBOT", 64);',
          '        renderer.drawBannerText(ctx, w, "BREAKER", 92);',
          "      }",
          "    }",
          "",
          '    retryBtn.addEventListener("click", () => {',
          "      retryBtn.blur();",
          "      startStage(currentStageIdx);",
          "    });",
          '    titleBackBtn.addEventListener("click", () => {',
          "      titleBackBtn.blur();",
          "      showTitleScreen();",
          "    });",
          '    edReplayBtn.addEventListener("click", () => {',
          "      edReplayBtn.blur();",
          "      startStage(0);",
          "    });",
          '    edTitleBtn.addEventListener("click", () => {',
          "      edTitleBtn.blur();",
          "      showTitleScreen();",
          "    });",
          "",
          "    // === スティック＆ハンマー入力 ===",
          "    let activePointerId = null;",
          "    const MAX_R = 40;",
          "    const DEAD_R = 13;",
          "",
          "    function updateStickFromPoint(clientX, clientY) {",
          "      const rect = stickBase.getBoundingClientRect();",
          "      const cx = rect.left + rect.width / 2;",
          "      const cy = rect.top + rect.height / 2;",
          "      let dx = clientX - cx;",
          "      let dy = clientY - cy;",
          "      const dist = Math.hypot(dx, dy);",
          "      if (dist > MAX_R) {",
          "        dx = (dx / dist) * MAX_R;",
          "        dy = (dy / dist) * MAX_R;",
          "      }",
          '      stickKnobCanvas.style.transform = "translate(" + Math.round(dx) + "px, " + Math.round(dy) + "px)";',
          "      let next = 0;",
          "      if (dist >= DEAD_R) {",
          "        next = Math.abs(dx) >= Math.abs(dy) ? (dx > 0 ? RIGHT : LEFT) : (dy > 0 ? DOWN : UP);",
          "      }",
          "      if (next !== stickBits) {",
          "        stickBits = next;",
          "        drawStickBg(stickBits);",
          "      }",
          "    }",
          "",
          "    function resetStick() {",
          "      activePointerId = null;",
          "      if (stickBits !== 0) {",
          "        stickBits = 0;",
          "        drawStickBg(0);",
          "      }",
          '      stickKnobCanvas.style.transform = "translate(0px, 0px)";',
          "    }",
          "",
          '    stickBase.addEventListener("pointerdown", e => {',
          "      e.preventDefault();",
          "      activePointerId = e.pointerId;",
          "      if (stickBase.setPointerCapture) { try { stickBase.setPointerCapture(e.pointerId); } catch (_) {} }",
          "      updateStickFromPoint(e.clientX, e.clientY);",
          "    });",
          '    stickBase.addEventListener("pointermove", e => {',
          "      if (e.pointerId !== activePointerId) return;",
          "      e.preventDefault();",
          "      updateStickFromPoint(e.clientX, e.clientY);",
          "    });",
          '    stickBase.addEventListener("pointerup", e => { if (e.pointerId === activePointerId) resetStick(); });',
          '    stickBase.addEventListener("pointercancel", e => { if (e.pointerId === activePointerId) resetStick(); });',
          "",
          "    let hammerPointerId = null;",
          "    function setHammerPressed(on) {",
          "      if (hammerBtnDown !== on) {",
          "        hammerBtnDown = on;",
          "        drawHammerBtn(on);",
          "      }",
          "    }",
          '    hammerBtn.addEventListener("pointerdown", e => {',
          "      e.preventDefault();",
          "      hammerPointerId = e.pointerId;",
          "      if (hammerBtn.setPointerCapture) { try { hammerBtn.setPointerCapture(e.pointerId); } catch (_) {} }",
          "      setHammerPressed(true);",
          "    });",
          '    hammerBtn.addEventListener("pointerup", e => {',
          "      if (e.pointerId === hammerPointerId) { hammerPointerId = null; setHammerPressed(false); }",
          "    });",
          '    hammerBtn.addEventListener("pointercancel", e => {',
          "      if (e.pointerId === hammerPointerId) { hammerPointerId = null; setHammerPressed(false); }",
          "    });",
          "",
          "    const KEY_MAP = {",
          "      ArrowUp: UP, KeyW: UP,",
          "      ArrowDown: DOWN, KeyS: DOWN,",
          "      ArrowLeft: LEFT, KeyA: LEFT,",
          "      ArrowRight: RIGHT, KeyD: RIGHT,",
          "      Space: HAMMER, KeyZ: HAMMER, KeyJ: HAMMER",
          "    };",
          "    function recomputeKeys() {",
          "      let b = 0;",
          "      for (const code of pressedKeys) b |= KEY_MAP[code] || 0;",
          "      keyBits = b;",
          "    }",
          '    window.addEventListener("keydown", e => {',
          "      if (screenMode !== 'play') return;",
          "      if (KEY_MAP[e.code]) { e.preventDefault(); pressedKeys.add(e.code); recomputeKeys(); }",
          "    });",
          '    window.addEventListener("keyup", e => {',
          "      if (screenMode !== 'play') return;",
          "      if (KEY_MAP[e.code]) { pressedKeys.delete(e.code); recomputeKeys(); }",
          "    });",
          '    window.addEventListener("blur", () => {',
          "      pressedKeys.clear(); recomputeKeys(); resetStick(); hammerPointerId = null; setHammerPressed(false);",
          "    });",
          "",
          "    const STEP_MS = 1000 / 60;",
          "    let lastTime = performance.now();",
          "    let acc = 0;",
          "",
          "    function loop(now) {",
          "      const dt = Math.min(100, now - lastTime);",
          "      lastTime = now;",
          "      acc += dt;",
          "      while (acc >= STEP_MS) {",
          "        acc -= STEP_MS;",
          "        if (screenMode === 'play' && world) {",
          "          world.step(currentBits());",
          "          if (world.deathFinished || world.tryAgainFinished) {",
          "            startStage(currentStageIdx);",
          "            acc = 0;",
          "            break;",
          "          }",
          "          if (world.clearFinished) {",
          "            if (currentStageIdx + 1 < DEMO_STAGES.length) {",
          "              startStage(currentStageIdx + 1);",
          "            } else {",
          "              showEndingScreen();",
          "            }",
          "            acc = 0;",
          "            break;",
          "          }",
          "        } else {",
          "          titleTick++;",
          "        }",
          "      }",
          "      if (screenMode === 'play' && world) {",
          "        renderer.draw(world);",
          "      } else {",
          "        drawSceneOverlayScreen(screenMode === 'ending');",
          "      }",
          "      requestAnimationFrame(loop);",
          "    }",
          "",
          "    showTitleScreen();",
          "    requestAnimationFrame(loop);",
          "  })();",
          scClose,
          "</body>",
          "</html>"
        ].join("\n");

        const blob = new Blob([html], { type: "text/html;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "robot_breaker.html";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        statusEl.textContent = "robot_breaker.html をダウンロードしました！単体でそのまま開いて遊べます。";
      }

      buildBtn.addEventListener("click", buildStandaloneHtml);
      updateFileStatus();
    })();
  </script>

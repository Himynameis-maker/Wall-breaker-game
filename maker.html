<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ROBOT BREAKER HTMLメーカー</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px;
      background: #10141d;
      color: #edf2f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .wrap {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card {
      background: #171d29;
      border: 1px solid #2e3952;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    h1 {
      margin: 0;
      font-size: 1.05rem;
      color: #82b4ff;
    }
    p, li {
      margin: 0;
      font-size: 0.82rem;
      color: #b7c4db;
      line-height: 1.5;
    }
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    button, label.file-btn, a.link-btn {
      background: #283247;
      color: #edf2f8;
      border: 1px solid #415072;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.84rem;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    button.primary {
      background: #1f8a4c;
      border-color: #40c476;
      font-weight: bold;
    }
    button.blue {
      background: #2b65d9;
      border-color: #6296ff;
      font-weight: bold;
    }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    input[type="file"] { display: none; }
    .file-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 4px;
      font-size: 0.74rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .file-item {
      padding: 4px 6px;
      border-radius: 5px;
      background: #111622;
      border: 1px solid #2a334a;
      color: #96a4bd;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-item.ok {
      border-color: #2d8a55;
      color: #7df0a8;
      background: #10241b;
    }
    textarea {
      width: 100%;
      min-height: 74px;
      background: #0c1018;
      color: #dce6f7;
      border: 1px solid #303d58;
      border-radius: 6px;
      padding: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.72rem;
    }
    .status {
      font-size: 0.82rem;
      font-weight: bold;
      color: #ffd970;
    }
    .preview-box {
      width: 100%;
      border: 2px solid #3b4b6d;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
    }
    iframe#previewFrame {
      width: 100%;
      height: 540px;
      border: none;
      display: block;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="btn-row" style="justify-content:space-between;">
        <h1>ROBOT BREAKER 単独HTMLメーカー</h1>
        <a class="link-btn" href="./index.html">← ゲームへ</a>
      </div>
      <p>
        手元のプログラム15本を読み込んで、タイトル(OP)・3ステージ・クリア画面入りの
        <b>1ファイル完結版（robot_breaker.html）</b>を作ります。変数名もオリジナルへ自動置換します。
      </p>
      <div id="loadStatus" class="status">ファイルを自動読込中...</div>
      <div class="btn-row">
        <label class="file-btn">
          📁 ファイル手動選択（ローカル直開き用・複数可）
          <input id="fileInput" type="file" multiple accept=".js,.txt">
        </label>
        <button id="retryFetchBtn" type="button">再自動読込</button>
      </div>
      <div id="fileGrid" class="file-grid"></div>
    </div>

    <div class="card">
      <p><b>3ステージデータ（今回の3ステージを初期入力済み・変更も可）</b></p>
      <textarea id="stagesInput"></textarea>
    </div>

    <div class="card">
      <div class="btn-row">
        <button id="buildBtn" class="primary" type="button" disabled>1. robot_breaker.html を生成する</button>
        <button id="downloadBtn" class="blue" type="button" disabled>2. ダウンロード保存</button>
        <button id="previewBtn" type="button" disabled>その場で試遊テスト</button>
        <button id="copyBtn" type="button" disabled>HTML全文コピー</button>
      </div>
      <div id="buildStatus" class="status"></div>
    </div>

    <div id="previewCard" class="card hidden">
      <div class="btn-row" style="justify-content:space-between;">
        <p><b>完成HTML その場プレビュー</b></p>
        <button id="closePreviewBtn" type="button">閉じる</button>
      </div>
      <div class="preview-box">
        <iframe id="previewFrame" title="ROBOT BREAKER プレビュー"></iframe>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const REQUIRED_FILES = [
        "src/constants.js",
        "src/actor_stepper.js",
        "src/spike_ai.js",
        "src/enemy_ai.js",
        "src/game_world.js",
        "data/sprites.js",
        "src/renderer.js",
        "src/render_tiles.js",
        "src/render_actors.js",
        "src/render_enemies.js",
        "src/char_player.js",
        "src/char_spike.js",
        "src/char_spanagon.js",
        "src/char_eggplant.js",
        "src/char_fireball.js"
      ];

      const DEFAULT_STAGES_JSON = '{"demo1":{"stageNumber":1,"cols":16,"rows":8,"tiles":[[0,2,9],[0,3,9],[0,4,9],[0,5,9],[0,6,9],[0,7,9],[0,8,9],[0,9,9],[0,10,9],[0,11,9],[0,12,9],[0,13,9],[1,2,9],[1,3,9],[1,4,9],[1,5,9],[1,6,9],[1,7,9],[1,8,9],[1,9,9],[1,10,9],[1,11,9],[1,12,9],[1,13,9],[2,5,9],[2,6,9],[2,7,9],[2,8,9],[2,9,9],[2,10,9],[2,11,193],[2,12,193],[3,3,209],[3,4,9],[3,5,9],[3,6,9],[3,7,193],[3,8,146],[3,9,177],[3,10,146],[3,11,209],[3,12,9],[3,13,9],[4,2,9],[4,3,209],[4,4,9],[4,5,9],[4,6,9],[4,7,9],[4,8,1],[4,9,9],[4,10,9],[4,11,9],[4,12,9],[4,13,9],[5,2,9],[5,3,209],[5,4,9],[5,5,9],[5,6,9],[5,7,9],[5,8,1],[5,9,9],[5,10,9],[5,11,9],[5,12,9],[5,13,9],[6,2,9],[6,3,209],[6,4,9],[6,5,9],[6,6,9],[6,7,9],[6,8,1],[6,9,9],[6,10,9],[6,11,9],[6,12,9],[6,13,9],[7,3,209],[7,6,193],[7,7,193],[7,8,1]],"mario":{"x":64,"y":256,"dir":1},"spike":null,"enemies":[{"enemyType":"spanagon","x":32,"y":128,"dir":2}]},"demo2":{"stageNumber":2,"cols":16,"rows":8,"tiles":[[0,2,8],[0,13,8],[1,2,8],[1,4,193],[1,5,1],[1,9,1],[1,10,193],[1,13,8],[2,3,1],[2,7,1],[3,2,163],[3,4,209],[3,9,1],[3,11,163],[4,2,193],[4,3,193],[4,4,209],[4,5,193],[4,7,1],[4,8,9],[4,10,209],[5,4,209],[5,7,1],[6,2,209],[6,4,193],[6,5,193],[6,6,193],[6,7,209],[6,9,1],[6,10,193],[6,11,193],[7,2,209],[7,3,177],[7,4,209],[7,5,146],[7,6,146],[7,7,177],[7,8,146],[7,9,146],[7,13,1]],"mario":{"x":64,"y":32,"dir":2},"spike":null,"enemies":[{"enemyType":"eggplant","x":160,"y":256,"dir":2},{"enemyType":"eggplant","x":176,"y":256,"dir":2},{"enemyType":"eggplant","x":192,"y":256,"dir":2},{"enemyType":"spanagon","x":16,"y":256,"dir":2}]},"demo3":{"stageNumber":3,"cols":18,"rows":8,"tiles":[[0,3,146],[0,4,146],[0,8,9],[0,9,9],[0,10,9],[1,2,1],[1,3,8],[1,4,8],[1,5,1],[1,7,8],[1,8,9],[1,9,9],[1,10,9],[1,11,1],[1,13,8],[1,14,8],[1,15,9],[2,2,1],[2,3,9],[2,4,9],[2,5,9],[2,6,9],[2,7,9],[2,9,193],[2,10,193],[2,11,8],[2,12,9],[2,13,9],[2,14,9],[2,15,9],[3,2,9],[3,3,193],[3,4,225],[3,6,146],[3,7,146],[3,9,209],[3,10,8],[3,11,8],[3,12,8],[3,13,9],[3,14,9],[3,15,9],[4,2,9],[4,3,9],[4,4,9],[4,5,209],[4,6,209],[4,7,9],[4,8,1],[4,9,177],[4,10,241],[4,11,241],[4,12,241],[4,13,8],[4,14,193],[4,15,9],[5,4,225],[5,5,209],[5,6,209],[5,8,1],[5,10,1],[6,2,9],[6,3,2],[6,4,9],[6,5,9],[6,6,9],[6,7,9],[6,8,9],[6,9,2],[6,10,9],[6,11,9],[6,12,9],[6,13,9],[6,14,2],[6,15,9],[7,3,2],[7,9,2],[7,14,2]],"mario":{"x":96,"y":64,"dir":1},"spike":{"x":128,"y":256,"dir":2},"enemies":[{"enemyType":"eggplant","x":64,"y":256,"dir":1},{"enemyType":"eggplant","x":176,"y":256,"dir":1},{"enemyType":"eggplant","x":240,"y":256,"dir":1},{"enemyType":"eggplant","x":32,"y":256,"dir":1},{"enemyType":"spanagon","x":192,"y":64,"dir":2},{"enemyType":"spanagon","x":32,"y":192,"dir":1}]}}';

      const fileMap = new Map();
      let generatedHtml = "";

      const loadStatus = document.getElementById("loadStatus");
      const fileGrid = document.getElementById("fileGrid");
      const fileInput = document.getElementById("fileInput");
      const retryFetchBtn = document.getElementById("retryFetchBtn");
      const stagesInput = document.getElementById("stagesInput");
      const buildBtn = document.getElementById("buildBtn");
      const downloadBtn = document.getElementById("downloadBtn");
      const previewBtn = document.getElementById("previewBtn");
      const copyBtn = document.getElementById("copyBtn");
      const buildStatus = document.getElementById("buildStatus");
      const previewCard = document.getElementById("previewCard");
      const previewFrame = document.getElementById("previewFrame");
      const closePreviewBtn = document.getElementById("closePreviewBtn");

      stagesInput.value = DEFAULT_STAGES_JSON;

      function refreshFileGrid() {
        fileGrid.innerHTML = "";
        let okCount = 0;
        for (let i = 0; i < REQUIRED_FILES.length; i++) {
          const path = REQUIRED_FILES[i];
          const has = fileMap.has(path);
          if (has) okCount++;
          const div = document.createElement("div");
          div.className = "file-item" + (has ? " ok" : "");
          div.textContent = (has ? "✔ " : "・ ") + path.split("/").pop();
          div.title = path;
          fileGrid.appendChild(div);
        }
        buildBtn.disabled = okCount < REQUIRED_FILES.length;
        if (okCount === REQUIRED_FILES.length) {
          loadStatus.textContent = "準備OK！ 全15ファイルの読込が完了しています（下の緑ボタンを押してください）";
        } else {
          loadStatus.textContent = "読込済み: " + okCount + " / " + REQUIRED_FILES.length + "（不足分は上の「📁 ファイル手動選択」で src と data/sprites.js を選んでください）";
        }
      }

      async function tryAutoFetch() {
        loadStatus.textContent = "ファイルを自動読込中...";
        await Promise.all(REQUIRED_FILES.map(async path => {
          try {
            const res = await fetch("./" + path, { cache: "no-store" });
            if (res.ok) {
              const txt = await res.text();
              if (txt && txt.length > 20) {
                fileMap.set(path, txt);
              }
            }
          } catch (_) {}
        }));
        refreshFileGrid();
      }

      fileInput.addEventListener("change", async () => {
        const files = Array.from(fileInput.files || []);
        for (const f of files) {
          const baseName = f.name.replace(/\.txt$/i, ".js");
          const matched = REQUIRED_FILES.find(p => p.endsWith("/" + baseName));
          if (matched) {
            const txt = await f.text();
            fileMap.set(matched, txt);
          }
        }
        fileInput.value = "";
        refreshFileGrid();
      });

      retryFetchBtn.addEventListener("click", tryAutoFetch);

      function sanitizeCode(code) {
        return code
          .replace(/spanagonFast/g, "droneFast")
          .replace(/SPANAGON/g, "DRONE")
          .replace(/Spanagon/g, "Drone")
          .replace(/spanagon/g, "drone")
          .replace(/EGGPLANT/g, "CRAWLER")
          .replace(/Eggplant/g, "Crawler")
          .replace(/eggplant/g, "crawler")
          .replace(/MARIO/g, "HERO")
          .replace(/Mario/g, "Hero")
          .replace(/mario/g, "hero")
          .replace(/SPIKE/g, "BOSS")
          .replace(/Spike/g, "Boss")
          .replace(/spike/g, "boss")
          .replace(/WRECK/g, "BREAKER")
          .replace(/Wreck/g, "Breaker")
          .replace(/wreck/g, "breaker")
          .replace(/レッキングクルー/g, "ROBOT BREAKER")
          .replace(/レッキング/g, "ブレイカー")
          .replace(/マリオ/g, "ヒーロー")
          .replace(/スパイク/g, "ボス")
          .replace(/スパナゴン/g, "ドローン")
          .replace(/ナスビ仮面/g, "クローラー")
          .replace(/ナスビ/g, "クローラー")
          .replace(/スパナ/g, "パーツ")
          .replace(/任天堂/g, "オリジナル")
          .replace(/<\/script/gi, "<\\/script");
      }

      function sanitizeStages(rawText) {
        const parsed = JSON.parse(rawText);
        const list = [];
        const keys = Array.isArray(parsed)
          ? parsed
          : [parsed.demo1, parsed.demo2, parsed.demo3].filter(Boolean);
        for (let i = 0; i < Math.min(3, keys.length); i++) {
          const st = JSON.parse(JSON.stringify(keys[i]));
          st.stageNumber = i + 1;
          if ("mario" in st) {
            st.hero = st.mario;
            delete st.mario;
          }
          if ("spike" in st) {
            st.boss = st.spike;
            delete st.spike;
          }
          if (Array.isArray(st.enemies)) {
            st.enemies = st.enemies.map(e => {
              const ne = Object.assign({}, e);
              if (ne.enemyType === "spanagon") ne.enemyType = "drone";
              else if (ne.enemyType === "spanagonFast") ne.enemyType = "droneFast";
              else if (ne.enemyType === "eggplant") ne.enemyType = "crawler";
              return ne;
            });
          }
          list.push(st);
        }
        if (list.length === 0) throw new Error("ステージが見つかりません");
        return list;
      }

      function buildStandaloneHtml() {
        let stagesList;
        try {
          stagesList = sanitizeStages(stagesInput.value.trim());
        } catch (err) {
          buildStatus.textContent = "エラー：ステージJSONの形式が正しくありません";
          return;
        }

        const mergedScripts = REQUIRED_FILES.map(path => {
          return "/* === " + path.split("/").pop() + " === */\n" + sanitizeCode(fileMap.get(path));
        }).join("\n\n");

        const stagesCode = "const DEMO_STAGES = " + JSON.stringify(stagesList) + ";";

        const appScript = `
    (function () {
      const { RIGHT, LEFT, DOWN, UP, HAMMER, GameWorld } = window.BreakerGame;
      const { Renderer } = window.BreakerRender;

      ${stagesCode}

      const canvas = document.getElementById("gameCanvas");
      const screenWrap = document.getElementById("screenWrap");
      const renderer = new Renderer(canvas, { viewHeight: 240 });

      const titleBar = document.getElementById("titleBar");
      const playBar = document.getElementById("playBar");
      const endBar = document.getElementById("endBar");
      const stageBadge = document.getElementById("stageBadge");
      const retryBtn = document.getElementById("retryBtn");
      const toTitleBtn = document.getElementById("toTitleBtn");
      const replayTitleBtn = document.getElementById("replayTitleBtn");
      const replay1Btn = document.getElementById("replay1Btn");
      const controlsArea = document.getElementById("controlsArea");
      const stickBase = document.getElementById("stickBase");
      const stickCanvas = document.getElementById("stickCanvas");
      const knobCanvas = document.getElementById("knobCanvas");
      const hammerBtn = document.getElementById("hammerBtn");
      const hammerCanvas = document.getElementById("hammerCanvas");

      let screenMode = "title"; // "title" | "play" | "ending"
      let stageIdx = 0;
      let world = null;
      let bgTick = 0;
      let dummyWorld = new GameWorld(Object.assign({}, DEMO_STAGES[0], { skipIntro: true, fireball: false }));

      // 長押しテキスト選択・コンテキストメニューの完全ブロック
      [document.body, controlsArea, stickBase, hammerBtn].forEach(el => {
        el.addEventListener("contextmenu", e => e.preventDefault());
        el.addEventListener("selectstart", e => e.preventDefault());
      });

      // ドットグラ風スティック＆ハンマーボタン描画
      function drawDotStickBase() {
        const g = stickCanvas.getContext("2d");
        const w = 44;
        g.clearRect(0, 0, w, w);
        // 八角形ドット外枠
        for (let y = 0; y < w; y++) {
          for (let x = 0; x < w; x++) {
            const dx = Math.abs(x - 21.5);
            const dy = Math.abs(y - 21.5);
            if (dx + dy > 29 || dx > 21 || dy > 21) continue;
            const isEdge = dx + dy > 27.5 || dx > 19.5 || dy > 19.5;
            if (isEdge) {
              g.fillStyle = (x + y < 42) ? "#687eb0" : "#0b0e18";
            } else {
              g.fillStyle = "#1c2336";
            }
            g.fillRect(x, y, 1, 1);
          }
        }
        // 中央の十字溝
        g.fillStyle = "#101524";
        g.fillRect(20, 9, 4, 26);
        g.fillRect(9, 20, 26, 4);
        // 4方向ドット矢印
        g.fillStyle = "#88a4e0";
        // 上
        g.fillRect(21, 4, 2, 1); g.fillRect(20, 5, 4, 1); g.fillRect(19, 6, 6, 1);
        // 下
        g.fillRect(19, 37, 6, 1); g.fillRect(20, 38, 4, 1); g.fillRect(21, 39, 2, 1);
        // 左
        g.fillRect(4, 21, 1, 2); g.fillRect(5, 20, 1, 4); g.fillRect(6, 19, 1, 6);
        // 右
        g.fillRect(39, 21, 1, 2); g.fillRect(38, 20, 1, 4); g.fillRect(37, 19, 1, 6);
      }

      function drawDotKnob() {
        const g = knobCanvas.getContext("2d");
        const s = 18;
        g.clearRect(0, 0, s, s);
        for (let y = 0; y < s; y++) {
          for (let x = 0; x < s; x++) {
            const d = Math.hypot(x - 8.5, y - 8.5);
            if (d > 8.6) continue;
            if (d > 7.2) g.fillStyle = "#0a0e1a";
            else if (x < 7 && y < 7 && d > 2.5) g.fillStyle = "#9ec4ff";
            else if (x < 9 && y < 9) g.fillStyle = "#5282f0";
            else if (d > 5.8) g.fillStyle = "#203e94";
            else g.fillStyle = "#3462d4";
            g.fillRect(x, y, 1, 1);
          }
        }
        g.fillStyle = "#ffffff";
        g.fillRect(5, 4, 2, 2);
        g.fillRect(4, 5, 1, 1);
      }

      function drawDotHammerBtn(pressed) {
        const g = hammerCanvas.getContext("2d");
        const s = 30;
        const offY = pressed ? 2 : 0;
        g.clearRect(0, 0, s, s);
        for (let y = 0; y < s; y++) {
          for (let x = 0; x < s; x++) {
            const d = Math.hypot(x - 14.5, y - (13.5 + offY));
            if (d <= 12.6) {
              if (d > 11.2) g.fillStyle = "#22080a";
              else if (y < 11 + offY && d > 8.5) g.fillStyle = pressed ? "#ffaa98" : "#ff8874";
              else if (d > 9.5) g.fillStyle = "#981c16";
              else g.fillStyle = pressed ? "#ea4838" : "#d82e24";
              g.fillRect(x, y, 1, 1);
            } else if (!pressed && y > 15 && Math.hypot(x - 14.5, y - 16) <= 12.5) {
              g.fillStyle = "#520c0a";
              g.fillRect(x, y, 1, 1);
            }
          }
        }
        // 中央のドット絵ハンマーアイコン
        const hx = 9;
        const hy = 7 + offY;
        g.fillStyle = "#181d2c";
        g.fillRect(hx + 1, hy, 10, 6);
        g.fillRect(hx + 5, hy + 6, 3, 7);
        g.fillStyle = "#dce8fa";
        g.fillRect(hx + 2, hy + 1, 8, 4);
        g.fillStyle = "#8ea0bc";
        g.fillRect(hx + 2, hy + 4, 8, 1);
        g.fillStyle = "#ffe070";
        g.fillRect(hx + 3, hy + 1, 5, 1);
        g.fillStyle = "#e09848";
        g.fillRect(hx + 6, hy + 6, 1, 6);
      }

      drawDotStickBase();
      drawDotKnob();
      drawDotHammerBtn(false);

      function setFixedCanvas(w, h) {
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
          renderer.ctx.imageSmoothingEnabled = false;
        }
        canvas.style.aspectRatio = w + " / " + h;
        screenWrap.style.maxWidth = (w * 2) + "px";
      }

      function drawSceneBackdrop(tick) {
        const ctx = renderer.ctx;
        const w = 256;
        const h = 240;
        dummyWorld.f = tick;
        ctx.fillStyle = "#080b14";
        ctx.fillRect(0, 0, w, h);

        ctx.save();
        ctx.translate(0, 126);
        renderer.drawSpaceSky(ctx, w, -126, 126, dummyWorld);
        ctx.restore();

        // 下の足場（青鉄骨＋青ブロック）
        ctx.fillStyle = "#2858b8";
        ctx.fillRect(0, 186, w, 6);
        ctx.fillStyle = "#5890f8";
        ctx.fillRect(0, 186, w, 2);
        ctx.fillStyle = "#183070";
        ctx.fillRect(0, 190, w, 2);
        if (renderer.floorBlockPattern) {
          ctx.save();
          ctx.translate(0, 192);
          ctx.fillStyle = renderer.floorBlockPattern;
          ctx.fillRect(0, 0, w, h - 192);
          ctx.restore();
        }
      }

      function drawTitleScreen() {
        setFixedCanvas(256, 240);
        drawSceneBackdrop(bgTick);
        const ctx = renderer.ctx;

        renderer.drawBannerText(ctx, 256, "ROBOT BREAKER", 58);

        // キャラクター勢揃い展示
        const pImg = renderer.playerSprites && renderer.playerSprites.idle_R;
        const bImg = renderer.endoBossSprites && renderer.endoBossSprites.idle_L;
        const dImg = renderer.droneSprites && renderer.droneSprites.normalFront && renderer.droneSprites.normalFront.idle_L;
        const cImg = renderer.crawlerSprites && renderer.crawlerSprites.front && renderer.crawlerSprites.front.idle_L;
        if (pImg) ctx.drawImage(pImg, 44, 160);
        if (bImg) ctx.drawImage(bImg, 134, 160);
        if (dImg) ctx.drawImage(dImg, 164, 160);
        if (cImg) ctx.drawImage(cImg, 194, 160);

        renderer.drawBannerText(ctx, 256, "SELECT STAGE!", 116);
      }

      function drawEndingScreen() {
        setFixedCanvas(256, 240);
        drawSceneBackdrop(bgTick);
        const ctx = renderer.ctx;

        renderer.drawBannerText(ctx, 256, "THANK YOU", 66);
        renderer.drawBannerText(ctx, 256, "FOR PLAYING!", 94);

        const pImg = renderer.playerSprites && renderer.playerSprites.deadFall_R;
        const pIdle = renderer.playerSprites && renderer.playerSprites.idle_R;
        const img = (Math.floor(bgTick / 20) % 2 === 0 && pImg) ? pImg : pIdle;
        if (img) ctx.drawImage(img, 120, 160);
      }

      function updateModeBars() {
        titleBar.classList.toggle("hidden", screenMode !== "title");
        playBar.classList.toggle("hidden", screenMode !== "play");
        endBar.classList.toggle("hidden", screenMode !== "ending");
        controlsArea.classList.toggle("hidden", screenMode !== "play");
      }

      function startStage(idx) {
        stageIdx = Math.max(0, Math.min(DEMO_STAGES.length - 1, idx));
        screenMode = "play";
        const cfg = DEMO_STAGES[stageIdx];
        world = new GameWorld(Object.assign({}, cfg, { stageNumber: stageIdx + 1 }));
        world.hero.prevHammer = (currentBits() & HAMMER) !== 0;
        stageBadge.textContent = "STAGE " + (stageIdx + 1) + " / " + DEMO_STAGES.length;
        screenWrap.style.maxWidth = Math.max(512, world.worldWidth * 2) + "px";
        renderer.resetCamera(world);
        updateModeBars();
        renderer.draw(world);
      }

      function showTitle() {
        screenMode = "title";
        world = null;
        resetStick();
        setHammerPressed(false);
        updateModeBars();
      }

      function showEnding() {
        screenMode = "ending";
        world = null;
        resetStick();
        setHammerPressed(false);
        updateModeBars();
      }

      Array.from(document.querySelectorAll(".start-stage-btn")).forEach(btn => {
        btn.addEventListener("click", () => {
          startStage(Number(btn.dataset.stage) || 0);
          btn.blur();
        });
      });

      retryBtn.addEventListener("click", () => {
        startStage(stageIdx);
        retryBtn.blur();
      });

      toTitleBtn.addEventListener("click", () => {
        showTitle();
        toTitleBtn.blur();
      });

      replayTitleBtn.addEventListener("click", () => {
        showTitle();
        replayTitleBtn.blur();
      });

      replay1Btn.addEventListener("click", () => {
        startStage(0);
        replay1Btn.blur();
      });

      // 操作（擬似スティック・ボタン・キーボード）
      let stickBits = 0;
      let keyBits = 0;
      let hammerBtnDown = false;
      let activePointerId = null;
      const MAX_R = 40;
      const DEAD_R = 13;

      function currentBits() {
        let b = stickBits | keyBits | (hammerBtnDown ? HAMMER : 0);
        if ((b & (LEFT | RIGHT)) === (LEFT | RIGHT)) b &= ~(LEFT | RIGHT);
        if ((b & (UP | DOWN)) === (UP | DOWN)) b &= ~(UP | DOWN);
        return b;
      }

      function updateStickFromPoint(clientX, clientY) {
        const rect = stickBase.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        let dx = clientX - cx;
        let dy = clientY - cy;
        const dist = Math.hypot(dx, dy);
        if (dist > MAX_R) {
          dx = (dx / dist) * MAX_R;
          dy = (dy / dist) * MAX_R;
        }
        knobCanvas.style.transform = "translate(" + Math.round(dx) + "px, " + Math.round(dy) + "px)";
        if (dist < DEAD_R) stickBits = 0;
        else if (Math.abs(dx) >= Math.abs(dy)) stickBits = dx > 0 ? RIGHT : LEFT;
        else stickBits = dy > 0 ? DOWN : UP;
      }

      function resetStick() {
        activePointerId = null;
        stickBits = 0;
        knobCanvas.style.transform = "translate(0px, 0px)";
      }

      stickBase.addEventListener("pointerdown", e => {
        e.preventDefault();
        activePointerId = e.pointerId;
        if (stickBase.setPointerCapture) {
          try { stickBase.setPointerCapture(e.pointerId); } catch (_) {}
        }
        updateStickFromPoint(e.clientX, e.clientY);
      });
      stickBase.addEventListener("pointermove", e => {
        if (e.pointerId === activePointerId) {
          e.preventDefault();
          updateStickFromPoint(e.clientX, e.clientY);
        }
      });
      stickBase.addEventListener("pointerup", e => { if (e.pointerId === activePointerId) resetStick(); });
      stickBase.addEventListener("pointercancel", e => { if (e.pointerId === activePointerId) resetStick(); });

      let hammerPointerId = null;
      function setHammerPressed(on) {
        if (hammerBtnDown !== on) {
          hammerBtnDown = on;
          drawDotHammerBtn(on);
        }
      }
      hammerBtn.addEventListener("pointerdown", e => {
        e.preventDefault();
        hammerPointerId = e.pointerId;
        if (hammerBtn.setPointerCapture) {
          try { hammerBtn.setPointerCapture(e.pointerId); } catch (_) {}
        }
        setHammerPressed(true);
      });
      hammerBtn.addEventListener("pointerup", e => {
        if (e.pointerId === hammerPointerId) { hammerPointerId = null; setHammerPressed(false); }
      });
      hammerBtn.addEventListener("pointercancel", e => {
        if (e.pointerId === hammerPointerId) { hammerPointerId = null; setHammerPressed(false); }
      });

      const KEY_MAP = {
        ArrowUp: UP, KeyW: UP,
        ArrowDown: DOWN, KeyS: DOWN,
        ArrowLeft: LEFT, KeyA: LEFT,
        ArrowRight: RIGHT, KeyD: RIGHT,
        Space: HAMMER, KeyZ: HAMMER, KeyJ: HAMMER
      };
      const pressedKeys = new Set();

      function recomputeKeys() {
        let b = 0;
        for (const code of pressedKeys) b |= KEY_MAP[code] || 0;
        keyBits = b;
      }

      window.addEventListener("keydown", e => {
        if (screenMode !== "play") return;
        if (KEY_MAP[e.code]) {
          e.preventDefault();
          pressedKeys.add(e.code);
          recomputeKeys();
        }
      });
      window.addEventListener("keyup", e => {
        if (KEY_MAP[e.code]) {
          pressedKeys.delete(e.code);
          recomputeKeys();
        }
      });
      window.addEventListener("blur", () => {
        pressedKeys.clear();
        recomputeKeys();
        resetStick();
        hammerPointerId = null;
        setHammerPressed(false);
      });

      const STEP_MS = 1000 / 60;
      let lastTime = performance.now();
      let acc = 0;

      function loop(now) {
        const dt = Math.min(100, now - lastTime);
        lastTime = now;
        acc += dt;
        while (acc >= STEP_MS) {
          acc -= STEP_MS;
          bgTick++;
          if (screenMode === "play" && world) {
            world.step(currentBits());
            if (world.deathFinished || world.tryAgainFinished) {
              startStage(stageIdx);
              acc = 0;
              break;
            }
            if (world.clearFinished) {
              if (stageIdx < DEMO_STAGES.length - 1) {
                startStage(stageIdx + 1);
              } else {
                showEnding();
              }
              acc = 0;
              break;
            }
          }
        }
        if (screenMode === "title") {
          drawTitleScreen();
        } else if (screenMode === "ending") {
          drawEndingScreen();
        } else if (world) {
          renderer.draw(world);
        }
        requestAnimationFrame(loop);
      }

      showTitle();
      requestAnimationFrame(loop);
    })();`;
